name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release

      - name: Zip
        shell: pwsh
        run: Compress-Archive build\windows\x64\runner\Release\* universal_print-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: universal_print-windows-x64
          path: universal_print-windows-x64.zip
